# Can a GitHub runner read YouTube? (2026-10-25: the owner wants the whole Rav Meir Eliyahu pipeline on
# GitHub — "dont run any script in this pc") — list his channel, then read one lesson's page and download its
# audio. Plain runs were refused ("Sign in to confirm you're not a bot", even with the bgutil token server);
# this run signs in with the owner's exported YouTube cookies (secret YT_COOKIES, a cookies.txt file) and gives
# yt-dlp a JavaScript runtime (node) for YouTube's signature challenge.
name: YouTube access test
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'a video to download'
        default: '8VPhFvtXMxQ'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet -U "yt-dlp[default]" curl-cffi
          yt-dlp --version
      - name: Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then echo "no YT_COOKIES secret"; exit 1; fi
          printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          echo "cookies file: $(wc -l < "$RUNNER_TEMP/cookies.txt") lines"
      - name: List his channel (no download)
        continue-on-error: true
        run: yt-dlp --js-runtimes node --flat-playlist --playlist-end 5 --print "%(id)s %(duration)s %(title)s" "https://www.youtube.com/channel/UCLlBotitx4zAGffm_Wdh7Bg/videos"
      - name: One video's page (title, date)
        continue-on-error: true
        run: yt-dlp --js-runtimes node --cookies "$RUNNER_TEMP/cookies.txt" --skip-download --add-header "Accept-Language:he" --print "%(upload_date)s %(title)s" "https://www.youtube.com/watch?v=${{ inputs.id }}"
      - name: Audio, with the cookies
        run: |
          yt-dlp --js-runtimes node --cookies "$RUNNER_TEMP/cookies.txt" -f bestaudio -x --audio-format opus \
            --postprocessor-args "ExtractAudio:-ac 1 -ar 16000 -b:a 24k" -o "audio.%(ext)s" "https://www.youtube.com/watch?v=${{ inputs.id }}"
          ls -la audio.*
