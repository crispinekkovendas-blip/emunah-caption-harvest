name: Rebbe test (WhisperX Yiddish + Meta MMS)

# 2026-10-24 (the owner: "transcribe Lubavitcher Rebbe shiurim, try with one … run the test within github
# servers"). The library's method on one recording of the Rebbe: WhisperX (large-v3, Yiddish) writes the
# words, Meta MMS retimes the lines. The audio comes from archive.org (YouTube refuses the runners).
# Nothing goes to Supabase; the result is committed to video-batches/stt-test/rebbe/. See scripts/rebbe_test.py.
#
#   gh workflow run rebbe-test.yml --ref <branch> [-f item=<archive.org id>] [-f url=<audio url>] [-f minutes=20]

on:
  workflow_dispatch:
    inputs:
      item:
        description: 'archive.org identifier (empty = search for a sicha / farbrengen)'
        default: ''
      url:
        description: 'Direct audio link instead of archive.org'
        default: ''
      minutes:
        description: 'Minutes transcribed'
        default: '20'
      offset:
        description: 'Seconds skipped at the start'
        default: '60'
  push:
    branches: [claude/sweet-brahmagupta-4larfi]
    paths: [.github/workflows/rebbe-test.yml, scripts/rebbe_test.py]

permissions:
  contents: write

concurrency:
  group: rebbe-test
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet yt-dlp
      - name: The Rebbe's audio
        run: python -u scripts/rebbe_test.py fetch --item "${{ inputs.item }}" --url "${{ inputs.url }}" --minutes ${{ inputs.minutes || '20' }} --offset ${{ inputs.offset || '60' }} --out out/rebbe
      - uses: actions/upload-artifact@v4
        with:
          name: rebbe-audio
          path: out/rebbe

  stt:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache the model and the wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
            ~/.cache/torch
          key: stt-whisperx-yi-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet whisperx
      - uses: actions/download-artifact@v4
        with:
          name: rebbe-audio
          path: out/rebbe
      - name: WhisperX (large-v3, Yiddish)
        env:
          PYTHONPATH: scripts
        run: python -u scripts/rebbe_test.py stt --out out/rebbe
      - uses: actions/upload-artifact@v4
        with:
          name: rebbe-stt
          path: out/rebbe/stt.json

  retime:
    needs: stt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy soundfile uroman
      - uses: actions/download-artifact@v4
        with:
          name: rebbe-audio
          path: out/rebbe
      - uses: actions/download-artifact@v4
        with:
          name: rebbe-stt
          path: out/rebbe
      - name: Meta MMS retimes the lines (Yiddish)
        env:
          PYTHONPATH: scripts
        run: python -u scripts/rebbe_test.py retime --out out/rebbe
      - name: Keep the result in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-batches/stt-test/rebbe
          git commit -m "rebbe test: WhisperX Yiddish + Meta MMS" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
