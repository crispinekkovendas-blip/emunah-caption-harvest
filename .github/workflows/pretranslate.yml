name: Pre-translate subtitles

# Translates the subtitles of every lesson with a study ahead of time, so the site's player shows
# them at once: English (the default since 2026-10-05) and Portuguese (2026-10-06). Google's keyless
# endpoint, the same cache rows the site writes (videos/transcript/<id>/<lang>). Resumable: each run
# skips what is already translated and stops cleanly within its time budget; the schedule carries
# on until done. Runs here because the owner's 8 GB machine reaps long background jobs.

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Target languages, comma-separated, in order'
        default: en,pt
      minutes:
        description: 'Time budget for the whole run (minutes)'
        default: '330'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: pretranslate
  cancel-in-progress: false

jobs:
  pretranslate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LANGS: ${{ inputs.to || 'en,pt' }}
          BUDGET: ${{ inputs.minutes || '330' }}
        run: |
          # one language after the other, sharing the run's budget: a finished language only skips
          end=$(( $(date +%s) + BUDGET * 60 ))
          for lang in ${LANGS//,/ }; do
            left=$(( (end - $(date +%s)) / 60 ))
            if [ "$left" -lt 5 ]; then echo "budget used before $lang"; break; fi
            echo "── $lang · $left min left"
            node --experimental-transform-types --import ./scripts/ts-hook.mjs scripts/pretranslate-subs.mjs --to "$lang" --minutes "$left"
          done
