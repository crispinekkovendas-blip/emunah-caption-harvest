name: Translate a video batch (Claude)

# Claude Sonnet translates the subtitles of a batch of lessons from the Hebrew into English and
# Portuguese, line by line, with each lesson's study as context — one agent per chunk of ≤450 lines,
# high effort. Runs entirely on GitHub (the owner's computer can be off), back to back until the
# library is done:
#
#   make      resume the unfinished batch, or build the next one (video-batches/batch-NNN/)
#   translate one job per chunk without output: one Claude request each (one shot, no tools), ONE AT A TIME
#   publish   check every finished lesson, upload it to the site (by: claude), commit the outputs and
#             the report; when the batch is complete, start the next one
#
# Auth: the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, the owner's Claude
# subscription). When the plan's usage limit stops agents, the batch keeps what finished and the
# 2-hourly schedule resumes it once the limit has reset.
#
# LANES (2026-10-11, the owner: 5 batches at the same time; 10 since 2026-10-14, 20 since 2026-11-15 — "20 lanes of
# claude code purely"; no parallel agents inside a batch): the lanes run side by side, each its own batch and its own
# chain; inside a lane the agents run one after another. Each lane owns a fixed share of the lessons (hash of the id),
# so lanes never collide. The schedule (hourly) wakes all twenty lanes; a lane already running just goes on. Twenty
# lanes fill GitHub's 20 jobs at once for the account: the dubs (dub.yml) are disabled while the lanes run.
# HELPING (2026-11-07, the owner: "activate all lanes"): a lane with nothing new to take works the back half
# of a busy lane's batch, one piece at a time, pushing each piece; every piece already on the branch is skipped.
#
# TEST FIRST (2026-11-15, the owner: "before making lanes have big work we need to test that the fixed method is
# working"): the hourly schedule is off until one lane has gone through translate AND publish with the 2026-11-08
# fixes. A test run: gh workflow run translate-batch.yml -f lane=N -f max=20 -f chain=false (about 20 pieces, whole
# lessons, no next run); all lanes the same way: leave lane empty (the kick passes max and chain on). The ten-lane
# test passed the same day (39/39 lessons, $21.43); the schedule is back.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane 1-20 (empty = start all twenty lanes)'
        default: ''
      max:
        description: 'At most about this many pieces this run (whole lessons)'
        default: '250'
      chain:
        description: 'Start the lane again when this run made progress'
        type: boolean
        default: true
  schedule:
    - cron: '41 * * * *'

concurrency:
  group: video-batches-lane-${{ inputs.lane || 'kick' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  kick:
    if: inputs.lane == ''
    runs-on: ubuntu-latest
    steps:
      - name: Wake the twenty lanes
        env:
          GH_TOKEN: ${{ github.token }}
          # 2026-11-15: a kick by hand passes its max and chain on to the lanes (a test of all ten); the schedule
          # has no inputs → the defaults
          MAX: ${{ inputs.max || '250' }}
          CHAIN: ${{ github.event_name != 'workflow_dispatch' || inputs.chain }}
        run: |
          for lane in $(seq 1 20); do
            gh workflow run translate-batch.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f lane=$lane -f max=$MAX -f chain=$CHAIN
          done

  make:
    if: inputs.lane != ''
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.make.outputs.batch }}
      chunks: ${{ steps.make.outputs.chunks }}
      help: ${{ steps.make.outputs.help }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: tok
        name: Is there a Claude token?
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # no token yet: skip quietly (no failure e-mails every two hours) — see video-batches/README.md
          if [ -z "$TOKEN" ]; then echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set — nothing to do"; echo "has=false" >> "$GITHUB_OUTPUT"; else echo "has=true" >> "$GITHUB_OUTPUT"; fi
      - id: make
        if: steps.tok.outputs.has == 'true'
        name: Resume or make a batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node --experimental-transform-types --import ./scripts/ts-hook.mjs scripts/batch-make.mjs --size 25 --lane ${{ inputs.lane }} --max ${{ inputs.max || '250' }}
      - name: Commit the new batch
        if: steps.tok.outputs.has == 'true'
        run: |
          git config user.name "video-batches"
          git config user.email "actions@github.com"
          git add video-batches
          git diff --cached --quiet || (git commit -m "video-batches: ${{ steps.make.outputs.batch }} (lane ${{ inputs.lane }}) — work files" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done)

  translate:
    needs: make
    if: needs.make.outputs.chunks != '' && needs.make.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: ${{ fromJSON(needs.make.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # 2026-11-15: a piece of this run already met the plan's usage limit → nothing more to ask in this run
      - id: limit
        uses: actions/cache/restore@v4
        with:
          path: .claude-limit
          key: claude-limit-${{ github.run_id }}
          lookup-only: true
      - uses: actions/setup-node@v4
        if: steps.limit.outputs.cache-hit != 'true'
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code > /dev/null
        if: steps.limit.outputs.cache-hit != 'true'
      - id: tr
        name: Translate ${{ matrix.chunk }}
        if: steps.limit.outputs.cache-hit != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2026-11-15: each request wrote its whole work file (~7k tokens) to the 1-hour prompt cache — billed at
          # twice the input price — and nothing but the ~1k-token rules was ever read back: no cache
          DISABLE_PROMPT_CACHING: '1'
          BATCH: ${{ needs.make.outputs.batch }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          # ONE SHOT (2026-10-12): the work file goes in on stdin, the rules are the system prompt, no
          # tools — one request, the translation is the reply. The agent mode (Read/Write tools, 4–5
          # turns) re-read Claude Code's own prompt, the file and the written output every turn:
          # ~155k tokens per chunk, mostly cache reads; this is ~45–50k.
          D="$GITHUB_WORKSPACE/video-batches"
          IN="$D/$BATCH/in/$CHUNK.txt"
          OUT="$D/$BATCH/out/$CHUNK.txt"
          # 2026-11-07: a piece already on the branch (done by a helping lane, or by the owner) is not redone
          git pull -q --rebase || true
          if [ -s "$OUT" ]; then echo "$CHUNK already translated — skipped"; exit 0; fi
          set +e
          FULL="Translate the numbered lines under LINHAS A TRADUZIR following the system rules. Reply with ONLY the translation lines (N<TAB>English<TAB>Portuguese), one per line to translate, nothing before or after, no code fences."
          # 2026-11-08: the reply is read by scripts/batch-reply.mjs (a stray tab no longer loses a line, good
          # lines are kept between tries); an English-only reply has its Portuguese asked for separately and merged.
          # 2026-11-15 (the owner: "test on the lanes with all you learned"): of 42,835 replies 8% lacked lines, half
          # of them only 1–5 of 120, and the second try translated all 120 again. Now a try after the first asks ONLY
          # the missing lines (merged.missing; merged.retry.txt shows the rest of the part as context); the good lines of a piece
          # left incomplete are kept in out/<piece>.partial.json, so the next run asks only what is still missing.
          PART="$D/$BATCH/out/$CHUNK.partial.json"
          rm -f merged.json merged.missing merged.retry.txt en.txt
          if [ -s "$PART" ]; then
            cp "$PART" merged.json
            node scripts/batch-reply.mjs - "$IN" "$OUT" merged.json en.txt
          fi
          code=0
          for TRY in 1 2 3; do
            SRC="$IN"
            if [ -s merged.missing ]; then
              # merged.retry.txt: under LINHAS A TRADUZIR only the missing lines, the rest of the part as context
              SRC=merged.retry.txt
              ASK="Translate the numbered lines under LINHAS A TRADUZIR following the system rules — only those ($(tr -d '\n' < merged.missing)); the lines of this part already translated are there only as context. Reply with ONLY the translation lines (N<TAB>English<TAB>Portuguese), one per line to translate, nothing before or after, no code fences."
            elif [ "$TRY" = 1 ]; then
              ASK="$FULL"
            elif [ "$TRY" = 2 ]; then
              ASK="IMPORTANT: every line MUST have exactly THREE tab-separated columns (line number, English, Brazilian Portuguese) and every numbered line under LINHAS A TRADUZIR must be there. $FULL"
            else
              break # a third try only for a few missing lines, never the whole piece again
            fi
            echo "try $TRY: $([ "$SRC" = "$IN" ] && echo 'the whole piece' || echo "only lines $(tr -d '\n' < merged.missing)")"
            claude -p "$ASK" \
              --system-prompt "$(cat "$D/PROMPT.md")" --tools "" \
              --model sonnet --effort high --output-format json < "$SRC" > usage.json 2> err.txt
            code=$?
            # every attempt keeps its own usage record, so the report counts all of them
            cp usage.json "$D/$BATCH/out/$CHUNK.r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TRY.usage.json" 2>/dev/null || true
            # the plan's usage limit (10,973 requests refused that way by 2026-11-08, every later piece of the run
            # asking again): this piece stops, and the next step marks the run so its remaining pieces skip at once
            # (the finished ones are still published; the schedule resumes after the reset)
            if node -e 'const j = JSON.parse(require("fs").readFileSync("usage.json", "utf8")); process.exit(j.is_error && /hit your .*limit/i.test(String(j.result)) ? 0 : 1)' 2>/dev/null; then
              echo "::warning::Claude usage limit: $(node -e 'try{console.log(String(JSON.parse(require("fs").readFileSync("usage.json","utf8")).result).slice(0,120))}catch{}') — the rest of this run skips"
              mkdir -p .claude-limit && date -u > .claude-limit/hit
              echo "limit=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            node scripts/batch-reply.mjs usage.json "$IN" "$OUT" merged.json en.txt
            [ -s "$OUT" ] && break
          done
          # the last word: whatever good lines there are go to out/ (publish counts a try and asks the piece again),
          # and are kept for the next run
          if [ ! -s "$OUT" ] && [ -s merged.missing ]; then
            cp merged.json "$PART"
            node scripts/batch-reply.mjs - "$IN" "$OUT" merged.json en.txt final
          fi
          if [ ! -s "$OUT" ] && [ -s en.txt ]; then
            claude -p "Translate each English line below into Brazilian Portuguese (keep Hebrew names and terms as they are). Reply with ONLY lines N<TAB>Portuguese, same numbers, nothing else, no code fences." \
              --tools "" --model sonnet --output-format json < en.txt > usage-pt.json 2>> err.txt
            cp usage-pt.json "$D/$BATCH/out/$CHUNK.r$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-pt.usage.json" 2>/dev/null || true
            node -e '
              const fs = require("fs")
              let j = {}
              try { j = JSON.parse(fs.readFileSync("usage-pt.json", "utf8")) } catch {}
              const pt = new Map(String(j.result || "").split("\n").map((l) => l.replace(/\r$/, "").match(/^(\d+)\t([^\t]+)$/)).filter(Boolean).map((m) => [m[1], m[2]]))
              const en = fs.readFileSync("en.txt", "utf8").trim().split("\n").map((l) => l.split("\t"))
              if (!j.is_error && en.every(([n]) => pt.has(n))) {
                fs.writeFileSync(process.argv[1], en.map(([n, e]) => `${n}\t${e}\t${pt.get(n)}`).join("\n") + "\n")
                console.log(`merged ${en.length} English lines with their Portuguese`)
              } else console.log(`Portuguese reply incomplete: ${pt.size} of ${en.length}`)
            ' "$OUT"
          fi
          if [ -s "$OUT" ]; then
            echo "translated $CHUNK"
          else
            echo "::warning::$CHUNK not translated (exit $code) — the next run retries it"
            grep -ihE "limit|rate|quota|error|login" usage.json err.txt | head -5 || true
          fi
          # a helping lane pushes each piece at once — the owner skips it, and the owner's publish uses it
          if [ "${{ needs.make.outputs.help }}" = true ] && [ -s "$OUT" ]; then
            git config user.name "video-batches"
            git config user.email "actions@github.com"
            git add "$OUT" "$D/$BATCH/out/$CHUNK".r*.usage.json $([ -s "$PART" ] && echo "$PART")
            git commit -q -m "video-batches: $BATCH — $CHUNK (lane ${{ inputs.lane }} helping)"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i * 4)); done
          fi
      - if: steps.tr.outputs.limit == 'true'
        uses: actions/cache/save@v4
        with:
          path: .claude-limit
          key: claude-limit-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.chunk }}
          path: video-batches/${{ needs.make.outputs.batch }}/out/${{ matrix.chunk }}.*
          if-no-files-found: ignore

  # a helping lane does not publish the owner's batch (the owner does); it only looks for work again
  helped:
    needs: [make, translate]
    if: always() && needs.make.outputs.help == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: got
        name: Did this run translate anything?
        env:
          CHUNKS: ${{ needs.make.outputs.chunks }}
          BATCH: ${{ needs.make.outputs.batch }}
        run: |
          n=$(node -e 'const fs = require("fs"); console.log(JSON.parse(process.env.CHUNKS).filter((c) => fs.existsSync("video-batches/" + process.env.BATCH + "/out/" + c + ".txt")).length)')
          echo "pieces on the branch: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Keep the lane going (help again, or its own next batch)
        if: steps.got.outputs.n != '0' && inputs.chain != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run translate-batch.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f lane=${{ inputs.lane }}

  publish:
    needs: [make, translate]
    if: always() && needs.make.outputs.batch != '' && needs.make.outputs.help != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Count the outputs already there
        run: echo "BEFORE=$(ls video-batches/${{ needs.make.outputs.batch }}/out/*.p*.txt 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: video-batches/${{ needs.make.outputs.batch }}/out
      - id: progress
        name: Did this run translate anything?
        run: |
          AFTER=$(ls video-batches/${{ needs.make.outputs.batch }}/out/*.p*.txt 2>/dev/null | wc -l)
          echo "translated this run: $((AFTER - BEFORE))"
          echo "made=$((AFTER - BEFORE))" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Check and publish the finished lessons
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/batch-publish.mjs ${{ needs.make.outputs.batch }}
      - name: Commit outputs and report
        run: |
          git config user.name "video-batches"
          git config user.email "actions@github.com"
          git add video-batches
          git diff --cached --quiet || git commit -m "video-batches: ${{ needs.make.outputs.batch }} — translations and report"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Keep the lane going (the next batch, or the rest of this one)
        if: (steps.publish.outputs.complete == 'true' || steps.progress.outputs.made != '0') && inputs.chain != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run translate-batch.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f lane=${{ inputs.lane }}
