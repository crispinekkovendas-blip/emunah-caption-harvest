name: Transcribe lessons without captions (Whisper, ivrit.ai)

# 2026-10-18 (the owner: "lets harvest more"): the lessons YouTube never captioned get a Hebrew
# transcript from faster-whisper + ivrit.ai's model on the CPU runner. The audio waits in the draft
# release stt-queue (put there by W04 scripts/stt-feed.mjs on the owner's computer). See scripts/transcribe.py.
#
#   gh workflow run stt.yml                       (all lanes)
#   gh workflow run stt.yml -f lane=1 -f ids=abc  (a test)
#   gh workflow run stt.yml -f lane=1 -f ids=abc -f lang=yi
#       (2026-10-24: the Lubavitcher Rebbe's Yiddish; audio in the draft release stt-queue-yi. A run with
#        ids also commits the transcript to video-batches/stt-test/<id>.json to be read)

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane 1-8 (empty = start all eight)'
        default: ''
      ids:
        description: 'Only these ids (a test)'
        default: ''
      lang:
        description: 'Spoken language: he (ivrit.ai) or yi (large-v3, audio in stt-queue-yi)'
        default: 'he'
  schedule:
    - cron: '47 * * * *'

concurrency:
  group: stt-lane-${{ inputs.lane || 'kick' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  kick:
    if: inputs.lane == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 2026-10-24: only the lanes that own audio (all fourteen woke while any file waited, and spun empty)
      - name: Wake the lanes that own audio in the queue
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          lanes=$(python3 scripts/transcribe.py --owners 14)
          echo "lanes with audio: ${lanes:-none}"
          for lane in $lanes; do
            gh workflow run stt.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f lane=$lane
          done

  stt:
    if: inputs.lane != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache the model and the wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
            ~/.cache/torch
          key: ${{ inputs.lang == 'yi' && 'stt-whisperx-yi-v1' || 'stt-whisperx-ivrit-v1' }}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet whisperx
      - name: Transcribe
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u scripts/transcribe.py --lane ${{ inputs.lane }} --lanes 14 --budget-min 230 --lang ${{ inputs.lang || 'he' }} ${{ inputs.ids != '' && format('--ids {0} --out video-batches/stt-test', inputs.ids) || '' }}
      - name: Keep the test transcript in the repo
        if: inputs.ids != ''
        run: |
          [ -d video-batches/stt-test ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-batches/stt-test
          git commit -m "stt test: ${{ inputs.ids }} (${{ inputs.lang || 'he' }})" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      # 2026-10-24: only while THIS lane still owns audio and this run made progress — before, any file in the
      # queue (another lane's, or one that never transcribes) restarted every lane every 3½ minutes
      - name: Keep the lane going while its own audio waits
        if: inputs.ids == '' && (inputs.lang || 'he') == 'he' && steps.t.outputs.left != '0' && steps.t.outputs.done != '0' && steps.t.outputs.left != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stt.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f lane=${{ inputs.lane }}
